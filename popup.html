<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChartForge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-card">
    <header>
      <div>
        <h1>ChartForge</h1>
        <p>建立適合簡報使用的高解析度圖表</p>
      </div>
      <button id="reset-button" class="text-button" type="button">重設</button>
    </header>

    <form id="chart-form" novalidate>
      <section class="panel">
        <label for="chart-title">圖表名稱</label>
        <input id="chart-title" type="text" maxlength="120" placeholder="例如：標題" required>

        <details class="style-details title-style-details">
          <summary>標題文字樣式</summary>
          <div id="title-text-style" class="text-style-grid">
            <label class="font-control">字體
              <select class="text-font"></select>
            </label>
            <label>大小
              <input class="text-size" type="number" min="8" max="72" step="1" inputmode="numeric">
            </label>
            <label>文字顏色
              <input class="text-color" type="color">
            </label>
            <div class="style-toggles" aria-label="標題字型樣式">
              <label class="style-toggle" title="粗體"><input class="text-bold" type="checkbox"><span>粗體</span></label>
              <label class="style-toggle" title="斜體"><input class="text-italic" type="checkbox"><span>斜體</span></label>
            </div>
          </div>
        </details>

        <div class="two-column">
          <div>
            <label for="chart-type">圖表種類</label>
            <select id="chart-type">
              <option value="pie">圓餅圖</option>
              <option value="bar">長條圖</option>
              <option value="line">折線圖</option>
            </select>
          </div>
          <div>
            <label for="aspect-ratio">圖片比例</label>
            <select id="aspect-ratio">
              <option value="16:9">16:9</option>
              <option value="4:3">4:3</option>
              <option value="1:1">1:1</option>
            </select>
          </div>
        </div>

        <label for="pixel-ratio">輸出解析度</label>
        <select id="pixel-ratio">
          <option value="1">1x</option>
          <option value="2">2x</option>
          <option value="3">3x</option>
          <option value="4">4x</option>
        </select>
        <p id="resolution-hint" class="hint"></p>

        <fieldset class="theme-fieldset">
          <legend>顯示主題</legend>
          <div class="theme-switch" role="radiogroup" aria-label="顯示主題">
            <label><input type="radio" name="theme" value="system"><span>跟隨瀏覽器</span></label>
            <label><input type="radio" name="theme" value="light"><span>亮色</span></label>
            <label><input type="radio" name="theme" value="dark"><span>暗色</span></label>
          </div>
        </fieldset>
      </section>

      <section class="panel import-panel">
        <div class="section-heading">
          <div>
            <h2>從 Excel 匯入</h2>
            <p>指定標題列與欄位，再分組統計下方資料</p>
          </div>
        </div>
        <label for="excel-file">Excel 或 CSV 檔案</label>
        <input id="excel-file" class="file-input" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv">
        <label for="sheet-select">工作表</label>
        <select id="sheet-select" disabled><option value="">請先選擇檔案</option></select>
        <div class="two-column import-selectors">
          <div>
            <label for="header-row">標題所在列</label>
            <input id="header-row" type="number" min="1" step="1" value="1" disabled>
          </div>
          <div>
            <label for="column-select">統計欄位</label>
            <select id="column-select" disabled><option value="">請先選擇標題列</option></select>
          </div>
        </div>
        <button id="apply-import" class="secondary-button import-button" type="button" disabled>統計並套用</button>
        <p id="import-status" class="hint" role="status"></p>
      </section>

      <section class="panel data-panel">
        <div class="section-heading">
          <div>
            <h2>圖表資料</h2>
            <p>所有項目都會使用自訂顏色</p>
          </div>
          <button id="add-row" class="secondary-button" type="button">＋ 新增項目</button>
        </div>
        <div class="row-labels" aria-hidden="true"><span>項目名稱</span><span>數值</span><span>顏色</span><span></span></div>
        <div id="data-rows"></div>
        <p id="form-error" class="error" role="alert"></p>
      </section>

      <button class="primary-button" type="submit">產生圖表</button>
    </form>
  </main>
  <script src="lib/xlsx.full.min.js"></script>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
